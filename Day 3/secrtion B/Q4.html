<html>
    <head>
       
        <script>
       var num1 = parseFloat((prompt("Enter first number")))
       var num2 =parseFloat((prompt("Enter Second number")))
       var opp= (prompt("Enter the operator "))
       if(opp== "+") document.write("your ANS :"+ (num1+num2))
       else if(opp== "-") document.write("your ANS :"+ (num1-num2))
       else if (opp=="*") document.write("your ANS :"+ (num1*num2))
       else if(opp=="/")  document.write("your ANS :"+ (num1/num2))
       else document.write("Wrong choice")
        </script>
    </head>

</html>
