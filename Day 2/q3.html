<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <style>
        body{
            background-color: #2e3740;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container{   
            width: 50%;
        }
        .input{
            background-color: #2e3740;
            margin: 5px;
            border:  none;
            border-bottom: 1px solid #565656;
            width: 95%;
            padding: 10px;
            margin-bottom: 10px;
        }
        .register-button{
            background-color: #1ecf6d;
            margin: 5px;
            width: 100%;
            border: none;
            border-radius: 10px;
            color: white;
            height: 30px;
        }
        .rules-section{
            margin-top: 10px;
            margin-bottom: 10px;
            color: #565656;
        }
        p{
            color: #565656;
            text-align: center;
            
        }

        a{
            text-decoration: underline;
        }

    </style>
    </head>
    <body>
        <div class="container">
            <h1 style="color: #6d767e; text-align: center;">Register</h1>
            <div>
                <input class="input" type="text" placeholder="Username">
            </div>
            <div>
                <input class="input" type="password" placeholder="Password">
            </div>
            <div>
                <input class="input" type="email" placeholder="e-mail Address">
            </div>

            <div class="rules-section">
                <input type="radio" id="rules">
                <label for="rules">Accept rules and conditions</label>
            </div>

            <div > <button class="register-button" >Register</button> </div>
            <a href="*#">Already have an account?</a>
            

        </div>
    </body>
</html>
