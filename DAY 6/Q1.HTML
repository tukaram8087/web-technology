<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 2px solid black;
            text-align: center;
            width: 80vw;

        }

       
    </style>
    <script>
        function onTextArea(){
            let count = document.getElementById("text").value;
            var lengthofText =  count.length;

            document.getElementById("countVal").innerHTML = lengthofText;

        }
    </script>
</head>
<body>
    <div class="main-container">
        <div class="container">
            
            Enter your text below :
            <textarea name="text" id="text" rows="10" oninput="onTextArea()" ></textarea>
            <div class="count" >
                The count of letters are : 
                 <span id="countVal">0</span>
            </div>
           
            
        
    </div>
    <script>

    </script>
</body>
</html>
